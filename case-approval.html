<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Case Approval — ClaimsPro</title>
  <link rel="stylesheet" href="assets/style.css"/>
</head>
<body>
<div class="app-layout">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="top-header">
      <div class="header-left">
        <h2>Case Approval</h2>
        <p>Final approval or denial of evaluated cases</p>
      </div>
      <div class="header-right">
        <div class="header-user">
          <svg width="15" height="15" fill="none" stroke="#6b7280" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="header-user-name" id="headerUserName">User</span>
        </div>
        <div style="font-size:13px;font-weight:600;color:#0f3460;background:#eef2ff;padding:6px 14px;border-radius:8px;" id="pendingCount"></div>
      </div>
    </header>

    <main class="page-content">

      <!-- Summary cards -->
      <div class="stats-grid" id="summaryCards" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px;"></div>

      <div class="card">

        <!-- Filter bar -->
        <div class="filter-bar">
          <input type="text" class="form-control search-box" id="searchInput" placeholder="Search by name, ID or type…"/>
          <select class="form-control" id="filterStatus" style="max-width:180px;">
            <option value="">All Statuses</option>
            <option value="evaluated">Evaluated</option>
            <option value="approved">Approved</option>
            <option value="denied">Denied</option>
          </select>
          <select class="form-control" id="filterRisk" style="max-width:160px;">
            <option value="">All Risk Levels</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Clear</button>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Case ID</th>
                <th>Claimant</th>
                <th>Type</th>
                <th>Claimed</th>
                <th>Evaluated Amt</th>
                <th>Approved Amt</th>
                <th>Risk</th>
                <th>Recommendation</th>
                <th>Status</th>
                <th style="text-align:center;">Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle">Case Details</div>
        <div style="font-size:12px;color:#6b7280;margin-top:2px;" id="modalSubtitle"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  document.getElementById('sidebar').innerHTML = App.sidebarHTML();
  App.init('approval');

  let currentCaseId = null;

  const REC_LABEL = { approve: 'Recommend Approval', review: 'Additional Review', deny: 'Recommend Denial' };
  const REC_COLOR = { approve: '#10b981', review: '#f59e0b', deny: '#ef4444' };

  /* ── Summary cards ───────────────────── */
  function renderSummary() {
    const all = App.getCases().filter(c => ['evaluated','approved','denied'].includes(c.status));
    const evaluated = all.filter(c => c.status === 'evaluated').length;
    const approved  = all.filter(c => c.status === 'approved').length;
    const denied    = all.filter(c => c.status === 'denied').length;
    const totalAmt  = all.filter(c => c.status === 'approved').reduce((s,c) => s + (c.approvedAmount||0), 0);

    document.getElementById('summaryCards').innerHTML = [
      { label: 'Awaiting Approval', value: evaluated, cls: 'purple', icon: `<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>` },
      { label: 'Approved Cases',    value: approved,  cls: 'green',  icon: `<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>` },
      { label: 'Denied Cases',      value: denied,    cls: 'red',    icon: `<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>` },
      { label: 'Total Approved Amt',value: App.fmtCurrency(totalAmt), cls: 'blue', icon: `<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>` }
    ].map(s => `
      <div class="stat-card ${s.cls}">
        <div class="stat-icon ${s.cls}">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${s.icon}</svg>
        </div>
        <div>
          <div class="stat-value">${s.value}</div>
          <div class="stat-label">${s.label}</div>
        </div>
      </div>
    `).join('');
  }

  /* ── Render table ─────────────────────── */
  function render() {
    renderSummary();

    const search  = document.getElementById('searchInput').value.toLowerCase();
    const stFilter= document.getElementById('filterStatus').value;
    const rkFilter= document.getElementById('filterRisk').value;

    let cases = App.getCases().filter(c =>
      ['evaluated','approved','denied'].includes(c.status)
    );

    document.getElementById('pendingCount').textContent =
      `${cases.filter(c => c.status === 'evaluated').length} Awaiting Approval`;

    if (search)   cases = cases.filter(c =>
      c.id.toLowerCase().includes(search) ||
      c.claimantName.toLowerCase().includes(search) ||
      c.claimType.toLowerCase().includes(search)
    );
    if (stFilter) cases = cases.filter(c => c.status === stFilter);
    if (rkFilter) cases = cases.filter(c => c.riskLevel === rkFilter);

    const tbody = document.getElementById('tableBody');
    if (!cases.length) {
      tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>
        </svg>
        <h3>No cases ready for approval</h3>
        <p>Cases appear here after evaluation is completed.</p>
      </div></td></tr>`;
      return;
    }

    tbody.innerHTML = cases.map(c => {
      const canApprove = c.status === 'evaluated';
      const rec = c.recommendation;
      return `
        <tr>
          <td class="td-bold">${c.id}</td>
          <td>
            <div style="font-weight:500;">${c.claimantName}</div>
            <div class="td-muted">${c.claimType}</div>
          </td>
          <td>${c.claimType}</td>
          <td>${App.fmtCurrency(c.amount)}</td>
          <td class="td-bold">${App.fmtCurrency(c.evaluatedAmount)}</td>
          <td>${c.approvedAmount != null ? `<span style="font-weight:700;color:#10b981;">${App.fmtCurrency(c.approvedAmount)}</span>` : '<span class="td-muted">—</span>'}</td>
          <td>${App.riskBadge(c.riskLevel)}</td>
          <td>${rec ? `<span style="font-size:12px;font-weight:600;color:${REC_COLOR[rec]||'#6b7280'};">${REC_LABEL[rec]||rec}</span>` : '<span class="td-muted">—</span>'}</td>
          <td>${App.statusBadge(c.status)}</td>
          <td class="td-actions" style="text-align:center;">
            <div class="flex gap-8" style="justify-content:center;">
              <button class="btn btn-outline btn-sm" onclick="openView('${c.id}')">View</button>
              ${canApprove ? `
                <button class="btn btn-success btn-sm" onclick="openDecision('${c.id}','approve')">Approve</button>
                <button class="btn btn-danger btn-sm"  onclick="openDecision('${c.id}','deny')">Deny</button>
              ` : ''}
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  /* ── Full detail view ─────────────────── */
  function openView(id) {
    const c = App.getCaseById(id);
    if (!c) return;
    currentCaseId = id;

    document.getElementById('modalTitle').textContent = `Full Case Summary — ${c.id}`;
    document.getElementById('modalSubtitle').textContent = `${c.claimType} · ${c.claimantName}`;

    const rec = c.recommendation;

    document.getElementById('modalBody').innerHTML = `
      <div style="margin-bottom:16px;">
        <div class="form-section-title">Claimant Details</div>
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">Name</div><div class="detail-value">${c.claimantName}</div></div>
          <div class="detail-item"><div class="detail-label">Email</div><div class="detail-value">${c.email}</div></div>
          <div class="detail-item"><div class="detail-label">Phone</div><div class="detail-value">${c.phone}</div></div>
          <div class="detail-item"><div class="detail-label">Policy No.</div><div class="detail-value">${c.policyNo||'—'}</div></div>
          <div class="detail-item"><div class="detail-label">Claim Type</div><div class="detail-value">${c.claimType}</div></div>
          <div class="detail-item"><div class="detail-label">Incident Date</div><div class="detail-value">${App.fmtDate(c.incidentDate)}</div></div>
          <div class="detail-item" style="grid-column:1/-1;"><div class="detail-label">Description</div><div class="detail-value" style="line-height:1.65;">${c.description}</div></div>
        </div>
      </div>
      <div class="divider"></div>
      <div style="margin-bottom:16px;">
        <div class="form-section-title">Financial Summary</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
          <div style="background:#f9fafb;border-radius:8px;padding:12px 14px;text-align:center;">
            <div style="font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;">Claimed</div>
            <div style="font-size:18px;font-weight:700;color:#374151;">${App.fmtCurrency(c.amount)}</div>
          </div>
          <div style="background:#eef2ff;border-radius:8px;padding:12px 14px;text-align:center;">
            <div style="font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;">Evaluated</div>
            <div style="font-size:18px;font-weight:700;color:#0f3460;">${App.fmtCurrency(c.evaluatedAmount)}</div>
          </div>
          <div style="background:${c.approvedAmount!=null?'#f0fdf4':'#f9fafb'};border-radius:8px;padding:12px 14px;text-align:center;">
            <div style="font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;">Approved</div>
            <div style="font-size:18px;font-weight:700;color:${c.approvedAmount!=null?'#10b981':'#9ca3af'};">${c.approvedAmount!=null?App.fmtCurrency(c.approvedAmount):'Pending'}</div>
          </div>
        </div>
      </div>
      <div class="divider"></div>
      <div>
        <div class="form-section-title">Evaluation Report</div>
        <div class="detail-grid" style="margin-bottom:12px;">
          <div class="detail-item"><div class="detail-label">Risk Level</div><div class="detail-value">${App.riskBadge(c.riskLevel)}</div></div>
          <div class="detail-item"><div class="detail-label">Recommendation</div><div class="detail-value" style="font-weight:600;color:${REC_COLOR[rec]||'#6b7280'};">${REC_LABEL[rec]||'—'}</div></div>
          <div class="detail-item"><div class="detail-label">Evaluated On</div><div class="detail-value">${App.fmtDateTime(c.evaluatedAt)}</div></div>
          <div class="detail-item"><div class="detail-label">Evaluator</div><div class="detail-value">${c.evaluatorName||'—'}</div></div>
        </div>
        <div style="background:#faf5ff;border-radius:8px;padding:12px 14px;font-size:13px;color:#374151;line-height:1.65;">${c.evaluationNotes||'—'}</div>
      </div>
      ${c.approvalNotes ? `
        <div class="divider"></div>
        <div>
          <div class="form-section-title">${c.status === 'approved' ? 'Approval' : 'Denial'} Decision</div>
          <div class="detail-grid" style="margin-bottom:12px;">
            <div class="detail-item"><div class="detail-label">Decision Date</div><div class="detail-value">${App.fmtDateTime(c.approvedAt||c.deniedAt)}</div></div>
            <div class="detail-item"><div class="detail-label">Decided By</div><div class="detail-value">${c.approvedBy||'—'}</div></div>
          </div>
          <div style="background:${c.status==='approved'?'#f0fdf4':'#fff5f5'};border-radius:8px;padding:12px 14px;font-size:13px;color:${c.status==='approved'?'#166534':'#991b1b'};line-height:1.65;">${c.approvalNotes}</div>
        </div>
      ` : ''}
    `;

    document.getElementById('modalFooter').innerHTML = `
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      ${c.status === 'evaluated' ? `
        <button class="btn btn-danger"  onclick="openDecision('${c.id}','deny')">Deny Case</button>
        <button class="btn btn-success" onclick="openDecision('${c.id}','approve')">Approve Case</button>
      ` : ''}
    `;

    openModal();
  }

  /* ── Decision modal ───────────────────── */
  function openDecision(id, decision) {
    const c = App.getCaseById(id);
    if (!c) return;
    currentCaseId = id;

    const isApprove = decision === 'approve';
    document.getElementById('modalTitle').textContent = isApprove ? 'Approve Case' : 'Deny Case';
    document.getElementById('modalSubtitle').textContent = `${c.id} — ${c.claimantName}`;

    document.getElementById('modalBody').innerHTML = `
      <div style="background:${isApprove?'#f0fdf4':'#fff5f5'};border:1px solid ${isApprove?'#bbf7d0':'#fecaca'};border-radius:10px;padding:14px 16px;margin-bottom:20px;font-size:13.5px;color:${isApprove?'#166534':'#991b1b'};">
        ${isApprove
          ? `You are about to <strong>approve</strong> and authorize payment for case <strong>${c.id}</strong>.`
          : `You are about to <strong>deny</strong> case <strong>${c.id}</strong>. This cannot be undone.`}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;background:#f9fafb;border-radius:8px;margin-bottom:20px;">
        <div><div class="detail-label">Claimant</div><div class="detail-value">${c.claimantName}</div></div>
        <div><div class="detail-label">Risk Level</div><div class="detail-value">${App.riskBadge(c.riskLevel)}</div></div>
        <div><div class="detail-label">Evaluated Amount</div><div class="detail-value" style="font-weight:700;color:#0f3460;font-size:15px;">${App.fmtCurrency(c.evaluatedAmount)}</div></div>
        <div><div class="detail-label">Evaluator Recommendation</div><div class="detail-value" style="font-weight:600;color:${REC_COLOR[c.recommendation]||'#6b7280'};">${REC_LABEL[c.recommendation]||'—'}</div></div>
      </div>
      ${isApprove ? `
        <div class="form-group" style="margin-bottom:16px;">
          <label class="form-label">Approved Amount (USD) <span class="required">*</span></label>
          <input type="number" class="form-control" id="approvedAmount" value="${c.evaluatedAmount}" min="0" step="0.01"/>
          <div class="form-error" id="errAmt">Enter a valid approved amount.</div>
          <div class="form-hint">Default is the evaluated amount. Adjust only if needed.</div>
        </div>
      ` : ''}
      <div class="form-group">
        <label class="form-label">${isApprove ? 'Approval' : 'Denial'} Notes <span class="required">*</span></label>
        <textarea class="form-control" id="decisionNotes" rows="3"
          placeholder="${isApprove ? 'Authorization notes and any special payment instructions…' : 'Required: reason for denial…'}"></textarea>
        <div class="form-error" id="errNotes">Notes are required.</div>
      </div>
    `;

    document.getElementById('modalFooter').innerHTML = `
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn ${isApprove ? 'btn-success' : 'btn-danger'}" onclick="submitDecision('${decision}')">
        ${isApprove ? 'Confirm Approval' : 'Confirm Denial'}
      </button>
    `;

    openModal();
  }

  function submitDecision(decision) {
    const isApprove = decision === 'approve';
    const notes = document.getElementById('decisionNotes').value.trim();
    let ok = true;

    if (!notes) {
      document.getElementById('errNotes').classList.add('show');
      document.getElementById('decisionNotes').classList.add('error');
      ok = false;
    } else {
      document.getElementById('errNotes').classList.remove('show');
      document.getElementById('decisionNotes').classList.remove('error');
    }

    if (isApprove) {
      const amt = parseFloat(document.getElementById('approvedAmount').value);
      if (!amt || amt <= 0) {
        document.getElementById('errAmt').classList.add('show');
        document.getElementById('approvedAmount').classList.add('error');
        ok = false;
      } else {
        document.getElementById('errAmt').classList.remove('show');
        document.getElementById('approvedAmount').classList.remove('error');
      }
    }

    if (!ok) return;

    const now = new Date().toISOString();
    const user = App.getUser()?.name || 'Unknown';

    if (isApprove) {
      App.updateCase(currentCaseId, {
        status: 'approved',
        approvedAt: now,
        approvedAmount: parseFloat(document.getElementById('approvedAmount').value),
        approvalNotes: notes,
        approvedBy: user
      });
      App.toast('Case approved and payment authorized.', 'success');
    } else {
      App.updateCase(currentCaseId, {
        status: 'denied',
        deniedAt: now,
        approvalNotes: notes,
        approvedBy: user
      });
      App.toast('Case denied.', 'error');
    }

    closeModal();
    render();
    App.renderBadges();
  }

  /* ── Helpers ──────────────────────────── */
  function openModal()  { document.getElementById('modalOverlay').classList.add('open'); }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); currentCaseId = null; }

  function clearFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterRisk').value = '';
    render();
  }

  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('filterStatus').addEventListener('change', render);
  document.getElementById('filterRisk').addEventListener('change', render);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  render();
</script>
</body>
</html>
