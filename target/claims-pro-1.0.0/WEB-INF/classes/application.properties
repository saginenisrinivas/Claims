# Server
server.port=9090

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Disable Thymeleaf auto-config (we use JSP)
spring.thymeleaf.enabled=false

# Allow static resources under /static/
spring.web.resources.static-locations=classpath:/static/,file:src/main/webapp/static/

# Session timeout
server.servlet.session.timeout=30m

# ── PostgreSQL Datasource ─────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/Claims_DB_BLIL
spring.datasource.username=postgres
spring.datasource.password=your_new_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Document Upload (stored as BLOB in claim_documents table)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.claimspro=DEBUG
