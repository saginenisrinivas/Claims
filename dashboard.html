<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — ClaimsPro</title>
  <link rel="stylesheet" href="assets/style.css"/>
</head>
<body>
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main -->
  <div class="main">
    <header class="top-header">
      <div class="header-left">
        <h2>Dashboard</h2>
        <p>Overview of all claims activity</p>
      </div>
      <div class="header-right">
        <div class="header-user">
          <svg width="15" height="15" fill="none" stroke="#6b7280" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="header-user-name" id="headerUserName">User</span>
        </div>
        <a href="case-registration.html" class="btn btn-primary btn-sm">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New Case
        </a>
      </div>
    </header>

    <main class="page-content">

      <!-- Stats -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- Two column -->
      <div style="display:grid;grid-template-columns:1fr 360px;gap:20px;">

        <!-- Recent Cases -->
        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">Recent Cases</div>
              <div class="card-subtitle">Latest 10 case submissions</div>
            </div>
            <a href="case-acceptance.html" class="btn btn-outline btn-sm">View All</a>
          </div>
          <div class="card-body-flush table-wrapper">
            <table id="recentTable">
              <thead>
                <tr>
                  <th>Case ID</th>
                  <th>Claimant</th>
                  <th>Type</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Submitted</th>
                </tr>
              </thead>
              <tbody id="recentBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Right column -->
        <div style="display:flex;flex-direction:column;gap:20px;">

          <!-- Pipeline -->
          <div class="card">
            <div class="card-header">
              <div class="card-title">Pipeline</div>
            </div>
            <div class="card-body" id="pipelineBody"></div>
          </div>

          <!-- Quick Actions -->
          <div class="card">
            <div class="card-header">
              <div class="card-title">Quick Actions</div>
            </div>
            <div class="card-body" style="display:flex;flex-direction:column;gap:10px;">
              <a href="case-registration.html" class="btn btn-primary w-full">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/><line x1="12" y1="11" x2="12" y2="17"/>
                  <line x1="9" y1="14" x2="15" y2="14"/>
                </svg>
                Register New Case
              </a>
              <a href="case-acceptance.html" class="btn btn-outline w-full">Review Pending Cases</a>
              <a href="case-evaluation.html" class="btn btn-ghost w-full">Cases for Evaluation</a>
              <a href="case-approval.html"   class="btn btn-ghost w-full">Cases for Approval</a>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  document.getElementById('sidebar').innerHTML = App.sidebarHTML();
  App.init('dashboard');

  function render() {
    const stats = App.getStats();
    const cases = App.getCases();

    /* Stats grid */
    const statsData = [
      { label: 'Total Cases',       value: stats.total,      icon: 'layers',   cls: 'primary' },
      { label: 'Pending Acceptance',value: stats.submitted,  icon: 'inbox',    cls: 'yellow'  },
      { label: 'Under Evaluation',  value: stats.under_eval, icon: 'clipboard',cls: 'blue'    },
      { label: 'Awaiting Approval', value: stats.evaluated,  icon: 'award',    cls: 'purple'  },
      { label: 'Approved',          value: stats.approved,   icon: 'check',    cls: 'green'   },
      { label: 'Rejected / Denied', value: stats.rejected,   icon: 'x-circle', cls: 'red'     }
    ];
    const icons = {
      layers:    `<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>`,
      inbox:     `<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/>`,
      clipboard: `<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="12" y2="16"/>`,
      award:     `<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>`,
      check:     `<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>`,
      'x-circle':`<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>`
    };

    document.getElementById('statsGrid').innerHTML = statsData.map(s => `
      <div class="stat-card ${s.cls}">
        <div class="stat-icon ${s.cls}">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            ${icons[s.icon]}
          </svg>
        </div>
        <div>
          <div class="stat-value">${s.value}</div>
          <div class="stat-label">${s.label}</div>
        </div>
      </div>
    `).join('');

    /* Recent cases table */
    const recent = cases.slice(0, 10);
    document.getElementById('recentBody').innerHTML = recent.length
      ? recent.map(c => `
          <tr>
            <td class="td-bold">${c.id}</td>
            <td>${c.claimantName}</td>
            <td>${c.claimType}</td>
            <td>${App.fmtCurrency(c.amount)}</td>
            <td>${App.statusBadge(c.status)}</td>
            <td class="td-muted">${App.fmtDate(c.submittedAt)}</td>
          </tr>
        `).join('')
      : `<tr><td colspan="6"><div class="empty-state"><p>No cases found.</p></div></td></tr>`;

    /* Pipeline */
    const pipeline = [
      { label: 'Submitted',       count: stats.submitted,  color: '#6b7280', href: 'case-acceptance.html' },
      { label: 'Accepted',        count: stats.accepted,   color: '#3b82f6', href: 'case-evaluation.html' },
      { label: 'Under Evaluation',count: stats.under_eval, color: '#f59e0b', href: 'case-evaluation.html' },
      { label: 'Evaluated',       count: stats.evaluated,  color: '#8b5cf6', href: 'case-approval.html'   },
      { label: 'Approved',        count: stats.approved,   color: '#10b981', href: 'case-approval.html'   }
    ];
    const pipelineMax = Math.max(...pipeline.map(p => p.count), 1);
    document.getElementById('pipelineBody').innerHTML = pipeline.map(p => `
      <div style="margin-bottom:12px;">
        <div class="flex justify-between mb-4" style="margin-bottom:4px;">
          <a href="${p.href}" style="font-size:12.5px;color:#374151;text-decoration:none;font-weight:500;">${p.label}</a>
          <span style="font-size:13px;font-weight:700;color:#111;">${p.count}</span>
        </div>
        <div style="height:6px;background:#f3f4f6;border-radius:4px;overflow:hidden;">
          <div style="height:100%;width:${(p.count/pipelineMax)*100}%;background:${p.color};border-radius:4px;transition:width .5s;"></div>
        </div>
      </div>
    `).join('');
  }

  render();
</script>
</body>
</html>
