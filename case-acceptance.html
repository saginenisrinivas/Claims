<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Case Acceptance — ClaimsPro</title>
  <link rel="stylesheet" href="assets/style.css"/>
</head>
<body>
<div class="app-layout">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="top-header">
      <div class="header-left">
        <h2>Case Acceptance</h2>
        <p>Review and accept or reject submitted cases</p>
      </div>
      <div class="header-right">
        <div class="header-user">
          <svg width="15" height="15" fill="none" stroke="#6b7280" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="header-user-name" id="headerUserName">User</span>
        </div>
        <div style="font-size:13px;font-weight:600;color:#0f3460;background:#eef2ff;padding:6px 14px;border-radius:8px;" id="pendingCount"></div>
      </div>
    </header>

    <main class="page-content">
      <div class="card">

        <!-- Filter bar -->
        <div class="filter-bar">
          <input type="text" class="form-control search-box" id="searchInput" placeholder="Search by name, ID or type…"/>
          <select class="form-control" id="filterStatus" style="max-width:180px;">
            <option value="">All Statuses</option>
            <option value="submitted">Submitted</option>
            <option value="accepted">Accepted</option>
            <option value="rejected">Rejected</option>
          </select>
          <select class="form-control" id="filterType" style="max-width:160px;">
            <option value="">All Types</option>
            <option>Medical</option>
            <option>Auto</option>
            <option>Property</option>
            <option>Life</option>
            <option>Travel</option>
            <option>Other</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Clear</button>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Case ID</th>
                <th>Claimant</th>
                <th>Type</th>
                <th>Claimed Amount</th>
                <th>Incident Date</th>
                <th>Submitted On</th>
                <th>Status</th>
                <th style="text-align:center;">Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- View / Action Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle">Case Details</div>
        <div style="font-size:12px;color:#6b7280;margin-top:2px;" id="modalSubtitle"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  document.getElementById('sidebar').innerHTML = App.sidebarHTML();
  App.init('acceptance');

  let currentCaseId = null;
  let currentAction = null; // 'accept' | 'reject' | 'view'

  /* ── Render ───────────────────────────── */
  function render() {
    const search  = document.getElementById('searchInput').value.toLowerCase();
    const stFilter= document.getElementById('filterStatus').value;
    const tyFilter= document.getElementById('filterType').value;

    let cases = App.getCases().filter(c =>
      ['submitted','accepted','rejected'].includes(c.status)
    );

    const pending = cases.filter(c => c.status === 'submitted').length;
    document.getElementById('pendingCount').textContent = `${pending} Pending`;

    if (search)   cases = cases.filter(c =>
      c.id.toLowerCase().includes(search) ||
      c.claimantName.toLowerCase().includes(search) ||
      c.claimType.toLowerCase().includes(search)
    );
    if (stFilter) cases = cases.filter(c => c.status === stFilter);
    if (tyFilter) cases = cases.filter(c => c.claimType === tyFilter);

    const tbody = document.getElementById('tableBody');
    if (!cases.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <h3>No cases found</h3><p>No cases match the current filters.</p>
      </div></td></tr>`;
      return;
    }

    tbody.innerHTML = cases.map(c => {
      const canAct = c.status === 'submitted';
      return `
        <tr>
          <td class="td-bold">${c.id}</td>
          <td>
            <div style="font-weight:500;">${c.claimantName}</div>
            <div class="td-muted">${c.email}</div>
          </td>
          <td>${c.claimType}</td>
          <td class="td-bold">${App.fmtCurrency(c.amount)}</td>
          <td class="td-muted">${App.fmtDate(c.incidentDate)}</td>
          <td class="td-muted">${App.fmtDate(c.submittedAt)}</td>
          <td>${App.statusBadge(c.status)}</td>
          <td class="td-actions" style="text-align:center;">
            <div class="flex gap-8" style="justify-content:center;">
              <button class="btn btn-outline btn-sm" onclick="openView('${c.id}')">View</button>
              ${canAct ? `
                <button class="btn btn-success btn-sm" onclick="openAction('${c.id}','accept')">Accept</button>
                <button class="btn btn-danger btn-sm"  onclick="openAction('${c.id}','reject')">Reject</button>
              ` : ''}
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  /* ── View modal ───────────────────────── */
  function openView(id) {
    const c = App.getCaseById(id);
    if (!c) return;
    currentCaseId = id;
    currentAction = 'view';

    document.getElementById('modalTitle').textContent = `Case Details — ${c.id}`;
    document.getElementById('modalSubtitle').textContent = `${c.claimType} · Submitted ${App.fmtDateTime(c.submittedAt)}`;

    document.getElementById('modalBody').innerHTML = `
      <div class="detail-grid" style="margin-bottom:16px;">
        <div class="detail-item"><div class="detail-label">Policy Number</div><div class="detail-value">${c.policyNo || '—'}</div></div>
        <div class="detail-item"><div class="detail-label">Sum Assured</div><div class="detail-value">${c.sumAssured || '—'}</div></div>
        <div class="detail-item"><div class="detail-label">Claimant Name</div><div class="detail-value">${c.claimantName}</div></div>
        <div class="detail-item"><div class="detail-label">Email</div><div class="detail-value">${c.email}</div></div>
        <div class="detail-item"><div class="detail-label">Phone</div><div class="detail-value">${c.phone}</div></div>
        <div class="detail-item"><div class="detail-label">Claim Type</div><div class="detail-value">${c.claimType}</div></div>
        <div class="detail-item"><div class="detail-label">Policy Number</div><div class="detail-value">${c.policyNo || '—'}</div></div>
        <div class="detail-item"><div class="detail-label">Policy SA</div><div class="detail-value">${c.policySA || '—'}</div></div>
        <div class="detail-item"><div class="detail-label">Priority</div><div class="detail-value">${c.priority ? c.priority.charAt(0).toUpperCase()+c.priority.slice(1) : 'Normal'}</div></div>
        <div class="detail-item"><div class="detail-label">Incident Date</div><div class="detail-value">${App.fmtDate(c.incidentDate)}</div></div>
        <div class="detail-item"><div class="detail-label">Claimed Amount</div><div class="detail-value" style="color:#0f3460;font-weight:700;font-size:15px;">${App.fmtCurrency(c.amount)}</div></div>
        <div class="detail-item" style="grid-column:1/-1;"><div class="detail-label">Location</div><div class="detail-value">${c.location || '—'}</div></div>
        <div class="detail-item" style="grid-column:1/-1;"><div class="detail-label">Description</div><div class="detail-value" style="line-height:1.65;">${c.description}</div></div>
      </div>
      ${c.status !== 'submitted' ? `
        <div class="divider"></div>
        <div style="margin-top:8px;">
          <div class="detail-label" style="margin-bottom:6px;">${c.status === 'accepted' ? 'Acceptance' : 'Rejection'} Notes</div>
          <div style="background:#f9fafb;border-radius:8px;padding:12px 14px;font-size:13.5px;color:#374151;">${c.acceptanceNotes || c.rejectionNotes || '—'}</div>
        </div>
      ` : ''}
    `;

    const canAct = c.status === 'submitted';
    document.getElementById('modalFooter').innerHTML = `
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      ${canAct ? `
        <button class="btn btn-danger"  onclick="openAction('${c.id}','reject')">Reject Case</button>
        <button class="btn btn-success" onclick="openAction('${c.id}','accept')">Accept Case</button>
      ` : ''}
    `;

    openModal();
  }

  /* ── Accept / Reject modal ────────────── */
  function openAction(id, action) {
    const c = App.getCaseById(id);
    if (!c) return;
    currentCaseId = id;
    currentAction = action;

    const isAccept = action === 'accept';
    document.getElementById('modalTitle').textContent = isAccept ? 'Accept Case' : 'Reject Case';
    document.getElementById('modalSubtitle').textContent = `${c.id} — ${c.claimantName}`;

    document.getElementById('modalBody').innerHTML = `
      <div style="background:${isAccept?'#f0fdf4':'#fff5f5'};border:1px solid ${isAccept?'#bbf7d0':'#fecaca'};border-radius:10px;padding:14px 16px;margin-bottom:20px;font-size:13.5px;color:${isAccept?'#166534':'#991b1b'};">
        ${isAccept
          ? `You are about to <strong>accept</strong> case <strong>${c.id}</strong>. The case will be queued for evaluation.`
          : `You are about to <strong>reject</strong> case <strong>${c.id}</strong>. This action will be logged.`}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;padding:12px;background:#f9fafb;border-radius:8px;">
        <div><div class="detail-label">Claimant</div><div class="detail-value">${c.claimantName}</div></div>
        <div><div class="detail-label">Amount</div><div class="detail-value" style="font-weight:700;color:#0f3460;">${App.fmtCurrency(c.amount)}</div></div>
        <div><div class="detail-label">Type</div><div class="detail-value">${c.claimType}</div></div>
        <div><div class="detail-label">Submitted</div><div class="detail-value">${App.fmtDate(c.submittedAt)}</div></div>
      </div>
      <div class="form-group">
        <label class="form-label">${isAccept ? 'Acceptance' : 'Rejection'} Notes ${isAccept ? '' : '<span class="required">*</span>'}</label>
        <textarea class="form-control" id="actionNotes" rows="3"
          placeholder="${isAccept ? 'Optional: add notes for the evaluator…' : 'Required: provide reason for rejection…'}"></textarea>
        <div class="form-error" id="notesErr">Rejection reason is required.</div>
      </div>
    `;

    document.getElementById('modalFooter').innerHTML = `
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn ${isAccept ? 'btn-success' : 'btn-danger'}" onclick="submitAction()">
        ${isAccept ? 'Confirm Acceptance' : 'Confirm Rejection'}
      </button>
    `;

    openModal();
  }

  function submitAction() {
    const notes = document.getElementById('actionNotes').value.trim();
    if (currentAction === 'reject' && !notes) {
      document.getElementById('notesErr').classList.add('show');
      return;
    }

    if (currentAction === 'accept') {
      App.updateCase(currentCaseId, {
        status: 'accepted',
        acceptedAt: new Date().toISOString(),
        acceptanceNotes: notes,
        acceptedBy: App.getUser()?.name || 'Unknown'
      });
      App.toast('Case accepted successfully.', 'success');
    } else {
      App.updateCase(currentCaseId, {
        status: 'rejected',
        rejectedAt: new Date().toISOString(),
        rejectionNotes: notes,
        rejectedBy: App.getUser()?.name || 'Unknown'
      });
      App.toast('Case rejected.', 'error');
    }

    closeModal();
    render();
    App.renderBadges();
  }

  /* ── Modal helpers ────────────────────── */
  function openModal()  { document.getElementById('modalOverlay').classList.add('open'); }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    currentCaseId = null;
    currentAction = null;
  }

  function clearFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterType').value = '';
    render();
  }

  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('filterStatus').addEventListener('change', render);
  document.getElementById('filterType').addEventListener('change', render);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  render();
</script>
</body>
</html>
